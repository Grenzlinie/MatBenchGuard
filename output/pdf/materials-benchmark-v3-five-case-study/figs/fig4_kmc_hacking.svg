<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690">
<rect width="1400" height="690" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.label{font-size:17px}.value{font-size:21px;font-weight:700}</style>
<text x="700" y="48" text-anchor="middle" class="title">Ferronematic repaired checker: observed rewards</text>
<line x1="100" y1="550" x2="1320" y2="550" stroke="#334155" stroke-width="3"/><line x1="100" y1="100" x2="100" y2="550" stroke="#334155" stroke-width="3"/>
<line x1="100" y1="190" x2="1320" y2="190" stroke="#0f172a" stroke-width="3" stroke-dasharray="10 8"/><text x="1305" y="180" text-anchor="end" class="label">pass threshold 0.8</text>
<g><rect x="135" y="100" width="105" height="450" fill="#16a34a"/><text x="187" y="88" text-anchor="middle" class="value">1.0</text><text x="187" y="580" text-anchor="middle" class="label">reference</text></g>
<g><rect x="275" y="100" width="105" height="450" fill="#22c55e"/><text x="327" y="88" text-anchor="middle" class="value">1.0</text><text x="327" y="580" text-anchor="middle" class="label">boundary</text></g>
<g><rect x="415" y="550" width="105" height="0" fill="#64748b"/><text x="467" y="530" text-anchor="middle" class="value">0</text><text x="467" y="580" text-anchor="middle" class="label">wrong</text></g>
<g><rect x="555" y="550" width="105" height="0" fill="#64748b"/><text x="607" y="530" text-anchor="middle" class="value">0</text><text x="607" y="580" text-anchor="middle" class="label">one group</text></g>
<g><rect x="695" y="550" width="105" height="0" fill="#64748b"/><text x="747" y="530" text-anchor="middle" class="value">0</text><text x="747" y="580" text-anchor="middle" class="label">cross swap</text></g>
<g><rect x="835" y="325" width="105" height="225" fill="#f59e0b"/><text x="887" y="313" text-anchor="middle" class="value">0.5</text><text x="887" y="580" text-anchor="middle" class="label">duplicate</text></g>
<g><rect x="975" y="325" width="105" height="225" fill="#f59e0b"/><text x="1027" y="313" text-anchor="middle" class="value">0.5</text><text x="1027" y="580" text-anchor="middle" class="label">unknown</text></g>
<g><rect x="1115" y="325" width="105" height="225" fill="#f59e0b"/><text x="1167" y="313" text-anchor="middle" class="value">0.5</text><text x="1167" y="580" text-anchor="middle" class="label">non-finite</text></g>
<text x="700" y="645" text-anchor="middle" class="label">Any one-file corruption or one-correct/one-wrong submission stays below 0.8</text>
</svg>
