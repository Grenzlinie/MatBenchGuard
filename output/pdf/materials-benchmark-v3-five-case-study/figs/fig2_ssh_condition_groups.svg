<rect width="1400" height="650" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.head{font-size:23px;font-weight:700}.sub{font-size:18px}.arrow{stroke:#334155;stroke-width:4}</style>
<text x="700" y="55" text-anchor="middle" class="title">Package visibility and one-way scientific authority</text>
<rect x="55" y="160" rx="18" width="270" height="180" fill="#e0f2fe" stroke="#334155" stroke-width="3"/><text x="190" y="215" text-anchor="middle" class="head">paper/paper.md</text><text x="190" y="255" text-anchor="middle" class="sub">reviewer-only source</text><text x="190" y="290" text-anchor="middle" class="sub">claims, methods, values</text>
<rect x="395" y="160" rx="18" width="270" height="180" fill="#dcfce7" stroke="#334155" stroke-width="3"/><text x="530" y="215" text-anchor="middle" class="head">instruction.md</text><text x="530" y="255" text-anchor="middle" class="sub">solver-visible problem</text><text x="530" y="290" text-anchor="middle" class="sub">self-contained contract</text>
<rect x="735" y="160" rx="18" width="270" height="180" fill="#fef3c7" stroke="#334155" stroke-width="3"/><text x="870" y="215" text-anchor="middle" class="head">derived views</text><text x="870" y="255" text-anchor="middle" class="sub">steps / manifest / task</text><text x="870" y="290" text-anchor="middle" class="sub">mirror only</text>
<rect x="1075" y="160" rx="18" width="270" height="180" fill="#ede9fe" stroke="#334155" stroke-width="3"/><text x="1210" y="215" text-anchor="middle" class="head">tests</text><text x="1210" y="255" text-anchor="middle" class="sub">hidden Gold / tolerance</text><text x="1210" y="290" text-anchor="middle" class="sub">no new requirements</text>
<g class="arrow"><line x1="325" y1="250" x2="395" y2="250"/><line x1="665" y1="250" x2="735" y2="250"/><line x1="1005" y1="250" x2="1075" y2="250"/></g>
<rect x="330" y="430" rx="16" width="740" height="105" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/><text x="700" y="475" text-anchor="middle" class="head">Solver never sees paper.md</text><text x="700" y="510" text-anchor="middle" class="sub">No “read the paper”; extract a standalone scientific question</text>
