<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><rect width="1400" height="650" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.main{font-size:23px;font-weight:700}.foot{font-size:21px;font-weight:700;fill:#7c2d12}</style><text x="700" y="55" text-anchor="middle" class="title">What v3 can and cannot guarantee</text><rect x="90" y="110" rx="20" width="1220" height="110" fill="#dbeafe" stroke="#334155" stroke-width="3"/><text x="700" y="175" text-anchor="middle" class="main">Q0-Q6: paper-aligned, self-contained computational-science question</text><rect x="180" y="255" rx="20" width="1040" height="110" fill="#dcfce7" stroke="#334155" stroke-width="3"/><text x="700" y="320" text-anchor="middle" class="main">A1-A6: Gold, applicability, tolerance, coverage, robustness, reward</text><rect x="270" y="400" rx="20" width="860" height="110" fill="#fef3c7" stroke="#334155" stroke-width="3"/><text x="700" y="465" text-anchor="middle" class="main">8 probes: correct passes; wrong, fabricated, cross-group fail</text><text x="700" y="585" text-anchor="middle" class="foot">Auditable fail-closed assurance, not proof that the paper itself is true</text></svg>
