<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650">
<rect width="1400" height="650" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:34px;font-weight:700}.main{font-size:25px;font-weight:700}.sub{font-size:19px}.line{stroke:#64748b;stroke-width:3}</style>
<text x="700" y="55" text-anchor="middle" class="title">Five v3 routes are evidence outcomes, not folder labels</text>
<rect x="500" y="95" rx="18" width="400" height="105" fill="#dbeafe" stroke="#334155" stroke-width="3"/><text x="700" y="140" text-anchor="middle" class="main">v3 Review</text><text x="700" y="175" text-anchor="middle" class="sub">Q0-Q6 + A1-A6</text>
<g class="line"><line x1="700" y1="200" x2="140" y2="365"/><line x1="700" y1="200" x2="420" y2="365"/><line x1="700" y1="200" x2="700" y2="365"/><line x1="700" y1="200" x2="980" y2="365"/><line x1="700" y1="200" x2="1260" y2="365"/></g>
<g><rect x="40" y="365" rx="16" width="200" height="90" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="140" y="420" text-anchor="middle" class="main">PASS</text><text x="140" y="500" text-anchor="middle" class="sub">Q/A all pass</text></g>
<g><rect x="320" y="365" rx="16" width="200" height="90" fill="#e0f2fe" stroke="#334155" stroke-width="2"/><text x="420" y="420" text-anchor="middle" class="main">REPAIR</text><text x="420" y="495" text-anchor="middle" class="sub">same target</text><text x="420" y="522" text-anchor="middle" class="sub">paper-backed fix</text></g>
<g><rect x="600" y="365" rx="16" width="200" height="90" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="700" y="420" text-anchor="middle" class="main">REAUTHOR</text><text x="700" y="495" text-anchor="middle" class="sub">new scientific</text><text x="700" y="522" text-anchor="middle" class="sub">target needed</text></g>
<g><rect x="880" y="365" rx="16" width="200" height="90" fill="#fee2e2" stroke="#334155" stroke-width="2"/><text x="980" y="420" text-anchor="middle" class="main">REJECT</text><text x="980" y="495" text-anchor="middle" class="sub">Q0 or missing</text><text x="980" y="522" text-anchor="middle" class="sub">indispensable asset</text></g>
<g><rect x="1160" y="365" rx="16" width="200" height="90" fill="#ede9fe" stroke="#334155" stroke-width="2"/><text x="1260" y="420" text-anchor="middle" class="main">BLOCKED</text><text x="1260" y="495" text-anchor="middle" class="sub">evidence pending</text><text x="1260" y="522" text-anchor="middle" class="sub">do not guess</text></g>
</svg>
